version: '3'
services:
  postgres:
    image: postgres:13
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  redis:
    image: redislabs/rejson:2.2.0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis:/bitnami/redis/data

  backend:
    image: bedrock/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend/backend:/backend
    environment:
      DB_NAME: "postgres"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "password"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      KEYCLOAK_ISSUER: "http://localhost:8081/realms/events"
      KEYCLOAK_KEYS_URL: "http://keycloak:8080/realms/events/protocol/openid-connect/certs"
      KEYCLOAK_ADMIN_ROLE: "events_admin"
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started

  worker:
    image: bedrock/worker:latest
    volumes:
      - ./backend/backend:/backend
    environment:
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
    build:
      dockerfile: Dockerfile.worker
      context: ./backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started

  beat:
    image: bedrock/beat:latest
    volumes:
      - ./backend/backend:/backend
    environment:
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
    build:
      dockerfile: Dockerfile.beat
      context: ./backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started
        
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - 8081:8080

volumes:
  postgres:
  redis:
